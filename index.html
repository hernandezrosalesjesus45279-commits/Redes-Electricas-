  <p class="social-subtitle">🌸Sigueme en mis redes para no perderte ningun stream 🌸</p>

  <!-- FRANJA DE CARRETERA -->
  <section class="strip" aria-hidden="true">
    <div class="grass grass-top" id="grassTop"></div>
    <div class="road">
      <div class="road-noise"></div>
      <div class="lane-line"></div>
      <div class="truck-wrap" id="truckWrap">
        <!-- ViewBox ampliado para una carrocería más larga -->
        <svg class="truck" viewBox="-280 0 780 205" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffbde0"/>
              <stop offset="0.3" stop-color="#d94f8c"/>
              <stop offset="0.7" stop-color="#732145"/>
              <stop offset="1" stop-color="#2a0918"/>
            </linearGradient>
            <!-- Gradiente de luz modificado para ser más largo e intenso -->
            <linearGradient id="beamGrad" x1="1" y1="0" x2="0" y2="0">
              <stop offset="0" stop-color="rgba(234,247,255,0.85)"/>
              <stop offset="0.7" stop-color="rgba(234,247,255,0.2)"/>
              <stop offset="1" stop-color="rgba(234,247,255,0)"/>
            </linearGradient>
            <!-- Plantilla de rueda -->
            <g id="wheelTemplate">
              <circle class="tire-outer" cx="0" cy="0" r="42"/>
              <g class="tread">
                <rect x="-4" y="-41" width="8" height="11" rx="1.5"/>
                <rect x="-4" y="-41" width="8" height="11" rx="1.5" transform="rotate(45)"/>
                <rect x="-4" y="-41" width="8" height="11" rx="1.5" transform="rotate(90)"/>
                <rect x="-4" y="-41" width="8" height="11" rx="1.5" transform="rotate(135)"/>
                <rect x="-4" y="-41" width="8" height="11" rx="1.5" transform="rotate(180)"/>
                <rect x="-4" y="-41" width="8" height="11" rx="1.5" transform="rotate(225)"/>
                <rect x="-4" y="-41" width="8" height="11" rx="1.5" transform="rotate(270)"/>
                <rect x="-4" y="-41" width="8" height="11" rx="1.5" transform="rotate(315)"/>
              </g>
              <circle class="rim-outer" cx="0" cy="0" r="26"/>
              <g class="spokes">
                <rect x="-3.5" y="-22" width="7" height="22" rx="2"/>
                <rect x="-3.5" y="-22" width="7" height="22" rx="2" transform="rotate(72)"/>
                <rect x="-3.5" y="-22" width="7" height="22" rx="2" transform="rotate(144)"/>
                <rect x="-3.5" y="-22" width="7" height="22" rx="2" transform="rotate(216)"/>
                <rect x="-3.5" y="-22" width="7" height="22" rx="2" transform="rotate(288)"/>
              </g>
              <circle class="hub-cap" cx="0" cy="0" r="8"/>
            </g>
          </defs>

          <!-- Sombra alargada -->
          <ellipse class="truck-shadow" cx="250" cy="190" rx="240" ry="8"/>

          <!-- Haz de luz RECTO hacia el frente -->
          <polygon points="30,102 -300,75 -300,125 30,108" fill="url(#beamGrad)" />

          <!-- Carrocería alargada -->
          <polygon class="truck-body" points="30,150 30,110 50,95 180,30 470,80 470,150" fill="url(#bodyGrad)"/>
          
          <!-- Cristales adaptados -->
          <polygon class="truck-glass" points="65,92 170,42 170,54 75,100"/>
          <polygon class="truck-glass" points="175,40 330,62 330,72 175,52"/>

          <!-- Reflejos -->
          <polygon fill="rgba(255,255,255,0.15)" points="85,82 120,65 130,65 95,82"/>
          <polygon fill="rgba(255,255,255,0.1)" points="190,58 230,52 235,52 195,58"/>

          <!-- Línea de pliegue -->
          <line class="truck-crease" x1="50" y1="95" x2="470" y2="80"/>
          
          <!-- Faro delantero -->
          <line class="truck-lightbar" x1="30" y1="110" x2="50" y2="95"/>
          <!-- Luz roja trasera -->
          <line class="truck-taillight" x1="469" y1="80" x2="469" y2="92"/>

          <!-- Pasos de rueda alargados y separados -->
          <polygon class="truck-arch" points="64,150 80,100 160,100 176,150"/>
          <polygon class="truck-arch" points="334,150 350,100 430,100 446,150"/>
          
          <!-- Zócalo inferior -->
          <rect class="truck-trim" x="30" y="142" width="440" height="8"/>


          <!-- Ruedas (separadas para mayor realismo de Cybertruck) -->
          <g class="wheel wheel-front">
            <use href="#wheelTemplate" x="120" y="150"/>
          </g>
          <g class="wheel wheel-rear">
            <use href="#wheelTemplate" x="390" y="150"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="grass grass-bottom" id="grassBottom"></div>
